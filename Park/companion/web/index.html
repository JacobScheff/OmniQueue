<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0a0d12" />
    <meta name="color-scheme" content="dark light" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="description"
      content="OmniQueue: a live Disneyland companion that plans your next rides with a trained routing model."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>OmniQueue Companion</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,400..800;1,14..32,400..800&family=Sora:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
    <script>
      // Apply the persisted theme (default dark) before paint to avoid a flash
      // of the wrong palette; App re-applies this once React mounts.
      (function () {
        try {
          var stored = localStorage.getItem("omniqueue-companion-theme");
          var theme =
            stored === "light" || stored === "dark" ? stored : "dark";
          document.documentElement.setAttribute("data-theme", theme);
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "dark");
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
