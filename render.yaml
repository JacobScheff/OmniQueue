# Free web services for the live companion and iOS forecast API.
# https://render.com/docs/blueprint-spec
services:
  - type: web
    name: omniqueue
    runtime: docker
    plan: free
    dockerfilePath: ./Park/companion/Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: COMPANION_DEVICE
        value: cpu
  - type: web
    name: omniqueue-forecasts
    runtime: docker
    plan: free
    rootDir: "Wait Time Predictions"
    healthCheckPath: /health
    envVars:
      - key: GOOGLE_CLOUD_PROJECT
        value: omniqueue-9ce1b
      - key: FIRESTORE_SERVICE_ACCOUNT_JSON
        sync: false
