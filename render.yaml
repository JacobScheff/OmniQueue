# Free single-service deploy for the live park companion (SPA + API + ONNX).
# https://render.com/docs/blueprint-spec
services:
  - type: web
    name: omniqueue
    runtime: docker
    plan: free
    dockerfilePath: ./Park/companion/Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: COMPANION_DEVICE
        value: cpu
